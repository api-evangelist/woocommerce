name: WooCommerce Rate Limits
generated: '2026-10-12'
method: searched
source: https://developer.woocommerce.com/docs/apis/store-api/rate-limiting/
note: Rate limiting applies to the Store API only, is optional and disabled by default, and runs on the merchant's own WordPress install; the REST API (wc/v3) documents no platform limit because WooCommerce is self-hosted.
headers:
- RateLimit-Limit
- RateLimit-Remaining
- RateLimit-Reset
- RateLimit-Retry-After
limits:
- name: Store API default POST limit
  limit_text: A default maximum of 25 requests can be made within a 10-second time frame.
  max: 25
  window: 10 seconds
  scope: per user ID (logged in) or IP address (unauthenticated)
  endpoint: Store API POST requests
- name: Checkout rate limiting
  limit_text: The limit will be a maximum of 3 requests per 60 seconds.
  max: 3
  window: 60 seconds
  scope: per user ID or IP address
  endpoint: POST /checkout
