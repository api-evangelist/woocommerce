openapi: 3.1.0
info:
  title: WooCommerce REST API
  description: >-
    The WooCommerce REST API is the primary server-side interface for reading
    and writing WooCommerce store data programmatically. It follows REST
    conventions, uses JSON for all requests and responses, and is fully
    integrated with the WordPress REST API under the /wp-json/wc/v3/ namespace.
    The API covers products, product variations, product categories, product
    attributes, orders, order notes, order refunds, customers, coupons, tax
    rates, shipping zones, payment gateways, settings, webhooks, reports, and
    system status. Authentication uses Consumer Key and Consumer Secret pairs
    generated in the WooCommerce admin, transmitted over HTTPS via HTTP Basic
    Auth or OAuth 1.0a over plain HTTP.
  version: 'v3'
  contact:
    name: WooCommerce Developer Support
    url: https://developer.woocommerce.com/docs/apis/rest-api/
  termsOfService: https://woocommerce.com/terms-conditions/
externalDocs:
  description: WooCommerce REST API Documentation
  url: https://woocommerce.github.io/woocommerce-rest-api-docs/
servers:
  - url: https://example.com/wp-json/wc/v3
    description: Production Server (replace example.com with your store domain)
tags:
  - name: Products
    description: Create, retrieve, update, and delete store products and their variations
  - name: Product Variations
    description: Manage variations of variable products including price, stock, and attributes
  - name: Product Categories
    description: Manage product categories used to organize the store catalog
  - name: Product Attributes
    description: Manage global product attributes and their terms
  - name: Product Tags
    description: Manage product tags used to label and filter products
  - name: Product Reviews
    description: Manage customer reviews on products
  - name: Orders
    description: Create, retrieve, update, and delete customer orders
  - name: Order Notes
    description: Manage private and customer-facing notes on orders
  - name: Order Refunds
    description: Create and retrieve refunds associated with orders
  - name: Customers
    description: Create, retrieve, update, and delete customer accounts
  - name: Coupons
    description: Create, retrieve, update, and delete discount coupons
  - name: Tax Rates
    description: Manage tax rates and tax classes applied at checkout
  - name: Shipping Zones
    description: Manage shipping zones, their locations, and shipping methods
  - name: Payment Gateways
    description: Retrieve and configure available payment gateways
  - name: Webhooks
    description: Create and manage webhooks that deliver event notifications to URLs
  - name: Settings
    description: Retrieve and update WooCommerce store settings groups and options
  - name: Reports
    description: Retrieve aggregated sales, product, and customer report data
  - name: System Status
    description: Retrieve system environment, active plugins, and store configuration status
security:
  - basicAuth: []
paths:
  /products:
    get:
      operationId: listProducts
      summary: List all products
      description: >-
        Returns a paginated list of products in the store. Supports filtering by
        status, category, tag, SKU, featured flag, on-sale flag, price range,
        stock status, and date ranges. Results are sorted by date by default.
        Use the page and per_page parameters to paginate through large catalogs.
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - name: status
          in: query
          description: >-
            Filter products by publication status. Options: any, draft, pending,
            private, publish.
          required: false
          schema:
            type: string
            enum: [any, draft, pending, private, publish]
        - name: category
          in: query
          description: Filter products by category ID.
          required: false
          schema:
            type: string
        - name: tag
          in: query
          description: Filter products by tag ID.
          required: false
          schema:
            type: string
        - name: on_sale
          in: query
          description: Limit results to products on sale when true.
          required: false
          schema:
            type: boolean
        - name: featured
          in: query
          description: Limit results to featured products when true.
          required: false
          schema:
            type: boolean
        - name: stock_status
          in: query
          description: >-
            Filter by stock status. Options: instock, outofstock, onbackorder.
          required: false
          schema:
            type: string
            enum: [instock, outofstock, onbackorder]
      responses:
        '200':
          description: Successful list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProduct
      summary: Create a product
      description: >-
        Creates a new product in the store. Requires at minimum a product name.
        Products can be simple, grouped, external/affiliate, or variable type.
        Pricing, stock management, shipping, tax settings, categories, tags,
        images, and attributes are all configurable at creation time.
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/{id}:
    get:
      operationId: getProduct
      summary: Retrieve a product
      description: >-
        Returns the details of a single product identified by its numeric ID.
        Includes all product properties such as pricing, stock, images,
        categories, tags, attributes, and metadata.
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProduct
      summary: Update a product
      description: >-
        Updates an existing product identified by its numeric ID. Only the
        properties included in the request body are updated; omitted properties
        retain their current values.
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProduct
      summary: Delete a product
      description: >-
        Deletes a product by its numeric ID. By default the product is moved to
        the trash. Set the force parameter to true to permanently delete the
        product and bypass the trash.
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/force'
      responses:
        '200':
          description: Product deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/batch:
    post:
      operationId: batchUpdateProducts
      summary: Batch create, update, and delete products
      description: >-
        Performs batch create, update, and delete operations on products in a
        single request. Pass arrays of product objects under the create, update,
        and delete keys respectively. Delete accepts an array of product IDs.
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchProductRequest'
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/{product_id}/variations:
    get:
      operationId: listProductVariations
      summary: List all product variations
      description: >-
        Returns all variations for a variable product identified by product_id.
        Each variation has its own pricing, SKU, stock, image, and attribute
        combination.
      tags:
        - Product Variations
      parameters:
        - $ref: '#/components/parameters/product_id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of product variations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVariation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createProductVariation
      summary: Create a product variation
      description: >-
        Creates a new variation for a variable product. The variation inherits
        the parent product's attributes and can override price, SKU, stock,
        weight, dimensions, and image independently.
      tags:
        - Product Variations
      parameters:
        - $ref: '#/components/parameters/product_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariationInput'
      responses:
        '201':
          description: Variation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/{product_id}/variations/{id}:
    get:
      operationId: getProductVariation
      summary: Retrieve a product variation
      description: >-
        Returns the details of a single product variation identified by the
        parent product ID and the variation ID.
      tags:
        - Product Variations
      parameters:
        - $ref: '#/components/parameters/product_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Product variation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProductVariation
      summary: Update a product variation
      description: >-
        Updates an existing variation for a variable product. Only the fields
        provided in the request body are changed.
      tags:
        - Product Variations
      parameters:
        - $ref: '#/components/parameters/product_id'
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVariationInput'
      responses:
        '200':
          description: Variation updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProductVariation
      summary: Delete a product variation
      description: >-
        Deletes a specific variation from a variable product. Set force to true
        to permanently delete rather than trash.
      tags:
        - Product Variations
      parameters:
        - $ref: '#/components/parameters/product_id'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/force'
      responses:
        '200':
          description: Variation deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVariation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/categories:
    get:
      operationId: listProductCategories
      summary: List all product categories
      description: >-
        Returns all product categories. Supports filtering by parent category,
        hiding empty categories, and ordering by various fields. Categories are
        hierarchical and can be nested.
      tags:
        - Product Categories
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/search'
        - name: hide_empty
          in: query
          description: Whether to hide resources not assigned to any products.
          required: false
          schema:
            type: boolean
        - name: parent
          in: query
          description: Filter categories by parent category ID.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProductCategory
      summary: Create a product category
      description: >-
        Creates a new product category. Categories can be nested by supplying a
        parent ID. A slug is generated automatically from the name if not
        provided.
      tags:
        - Product Categories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryInput'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /products/categories/{id}:
    get:
      operationId: getProductCategory
      summary: Retrieve a product category
      description: Returns a single product category by its numeric ID.
      tags:
        - Product Categories
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Product category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateProductCategory
      summary: Update a product category
      description: Updates a product category by its numeric ID.
      tags:
        - Product Categories
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryInput'
      responses:
        '200':
          description: Category updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteProductCategory
      summary: Delete a product category
      description: >-
        Deletes a product category by ID. Set force to true to permanently
        delete. Requires that no products are assigned to the category, or use
        force to bypass this restriction.
      tags:
        - Product Categories
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/force'
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders:
    get:
      operationId: listOrders
      summary: List all orders
      description: >-
        Returns a paginated list of orders. Supports filtering by status,
        customer ID, product ID, date ranges, and more. Orders are sorted by
        date_created descending by default.
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/search'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/before'
        - name: status
          in: query
          description: >-
            Filter orders by status. Options: any, pending, processing, on-hold,
            completed, cancelled, refunded, failed, trash.
          required: false
          schema:
            type: string
            enum: [any, pending, processing, on-hold, completed, cancelled, refunded, failed, trash]
        - name: customer
          in: query
          description: Filter orders by customer ID.
          required: false
          schema:
            type: integer
        - name: product
          in: query
          description: Filter orders that contain a specific product ID.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createOrder
      summary: Create an order
      description: >-
        Creates a new order. All order fields including billing, shipping, line
        items, coupons, shipping lines, and fee lines can be set at creation
        time. Customer ID is optional; guest checkout is supported.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Retrieve an order
      description: Returns a single order by its numeric ID including all line items, totals, billing, and shipping details.
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateOrder
      summary: Update an order
      description: >-
        Updates an existing order. Common use cases include changing order status,
        updating billing or shipping addresses, and modifying line item
        quantities. Only fields included in the request are changed.
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteOrder
      summary: Delete an order
      description: >-
        Deletes an order by its numeric ID. Set force to true to permanently
        delete rather than moving the order to the trash.
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/force'
      responses:
        '200':
          description: Order deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order_id}/notes:
    get:
      operationId: listOrderNotes
      summary: List all order notes
      description: >-
        Returns all notes associated with a specific order. Notes can be
        customer-facing or private (internal) and are ordered by date created.
      tags:
        - Order Notes
      parameters:
        - $ref: '#/components/parameters/order_id'
        - name: type
          in: query
          description: >-
            Limit results to a note type. Options: any, customer, internal.
          required: false
          schema:
            type: string
            enum: [any, customer, internal]
      responses:
        '200':
          description: List of order notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createOrderNote
      summary: Create an order note
      description: >-
        Adds a new note to an order. Notes can be marked as customer-facing,
        causing them to appear in order confirmation emails and the customer's
        order history.
      tags:
        - Order Notes
      parameters:
        - $ref: '#/components/parameters/order_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderNoteInput'
      responses:
        '201':
          description: Order note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{order_id}/notes/{id}:
    get:
      operationId: getOrderNote
      summary: Retrieve an order note
      description: Returns a single note for a specific order by note ID.
      tags:
        - Order Notes
      parameters:
        - $ref: '#/components/parameters/order_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Order note details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteOrderNote
      summary: Delete an order note
      description: Permanently deletes a specific note from an order.
      tags:
        - Order Notes
      parameters:
        - $ref: '#/components/parameters/order_id'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/force'
      responses:
        '200':
          description: Order note deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{order_id}/refunds:
    get:
      operationId: listOrderRefunds
      summary: List all order refunds
      description: Returns all refunds associated with a specific order.
      tags:
        - Order Refunds
      parameters:
        - $ref: '#/components/parameters/order_id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of order refunds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderRefund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createOrderRefund
      summary: Create an order refund
      description: >-
        Creates a refund for a specific order. The refund amount, line item
        quantities to refund, whether to restock items, and reason can all be
        specified. Automatic gateway refunds are attempted when supported.
      tags:
        - Order Refunds
      parameters:
        - $ref: '#/components/parameters/order_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRefundInput'
      responses:
        '201':
          description: Refund created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{order_id}/refunds/{id}:
    get:
      operationId: getOrderRefund
      summary: Retrieve an order refund
      description: Returns a single refund by its ID for a specific order.
      tags:
        - Order Refunds
      parameters:
        - $ref: '#/components/parameters/order_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Order refund details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteOrderRefund
      summary: Delete an order refund
      description: Permanently deletes a refund from an order.
      tags:
        - Order Refunds
      parameters:
        - $ref: '#/components/parameters/order_id'
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/force'
      responses:
        '200':
          description: Refund deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderRefund'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers:
    get:
      operationId: listCustomers
      summary: List all customers
      description: >-
        Returns a paginated list of customers. Can be filtered by role, email,
        search term, and order by various fields such as id, registered date,
        name, or total spent.
      tags:
        - Customers
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
