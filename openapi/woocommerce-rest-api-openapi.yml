        '200':
          description: System status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: >-
        HTTP Basic Auth using the WooCommerce Consumer Key as the username and
        Consumer Secret as the password over HTTPS. Over plain HTTP use OAuth
        1.0a one-legged authentication instead.
  parameters:
    id:
      name: id
      in: path
      description: Unique identifier for the resource.
      required: true
      schema:
        type: integer
    product_id:
      name: product_id
      in: path
      description: Unique identifier of the parent product.
      required: true
      schema:
        type: integer
    order_id:
      name: order_id
      in: path
      description: Unique identifier of the parent order.
      required: true
      schema:
        type: integer
    page:
      name: page
      in: query
      description: Current page of the collection. Defaults to 1.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      description: Maximum number of items per page. Defaults to 10, maximum 100.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    search:
      name: search
      in: query
      description: Limit results to those matching a string.
      required: false
      schema:
        type: string
    after:
      name: after
      in: query
      description: >-
        Limit response to resources created after a given ISO8601 compliant
        date.
      required: false
      schema:
        type: string
        format: date-time
    before:
      name: before
      in: query
      description: >-
        Limit response to resources created before a given ISO8601 compliant
        date.
      required: false
      schema:
        type: string
        format: date-time
    force:
      name: force
      in: query
      description: >-
        Set to true to permanently delete the resource, bypassing the trash.
      required: false
      schema:
        type: boolean
        default: false
  responses:
    Unauthorized:
      description: Authentication credentials are missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request body contains invalid or missing parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          description: Additional error context including HTTP status code.
          properties:
            status:
              type: integer
              description: HTTP status code associated with the error.
    Address:
      type: object
      description: Billing or shipping address associated with a customer or order.
      properties:
        first_name:
          type: string
          description: First name.
        last_name:
          type: string
          description: Last name.
        company:
          type: string
          description: Company name.
        address_1:
          type: string
          description: Address line 1.
        address_2:
          type: string
          description: Address line 2.
        city:
          type: string
          description: City name.
        state:
          type: string
          description: ISO code or name of the state, province, or district.
        postcode:
          type: string
          description: Postal code.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        email:
          type: string
          format: email
          description: Email address (billing only).
        phone:
          type: string
          description: Phone number (billing only).
    MetaData:
      type: object
      description: Custom metadata key-value entry.
      properties:
        id:
          type: integer
          description: Metadata unique identifier.
        key:
          type: string
          description: Metadata key.
        value:
          type: string
          description: Metadata value.
    ProductImage:
      type: object
      description: An image associated with a product.
      properties:
        id:
          type: integer
          description: Image unique identifier.
        src:
          type: string
          format: uri
          description: Image URL.
        name:
          type: string
          description: Image name.
        alt:
          type: string
          description: Image alternative text.
    ProductAttribute:
      type: object
      description: A product attribute with option values.
      properties:
        id:
          type: integer
          description: Attribute ID (0 for custom attributes).
        name:
          type: string
          description: Attribute name.
        position:
          type: integer
          description: Attribute position in the product.
        visible:
          type: boolean
          description: Whether the attribute is visible on the product page.
        variation:
          type: boolean
          description: Whether the attribute is used to define variations.
        options:
          type: array
          description: List of available options (terms) for this attribute.
          items:
            type: string
    ProductCategory:
      type: object
      description: A product category used to organize the store catalog.
      properties:
        id:
          type: integer
          description: Category unique identifier.
        name:
          type: string
          description: Category name.
        slug:
          type: string
          description: URL-friendly category identifier.
        parent:
          type: integer
          description: Parent category ID (0 for top-level categories).
        description:
          type: string
          description: Category description.
        display:
          type: string
          description: Category archive display type. Options: default, products, subcategories, both.
        image:
          $ref: '#/components/schemas/ProductImage'
        menu_order:
          type: integer
          description: Menu order position for sorting.
        count:
          type: integer
          description: Number of products in the category.
    ProductCategoryInput:
      type: object
      description: Input for creating or updating a product category.
      properties:
        name:
          type: string
          description: Category name (required for create).
        slug:
          type: string
          description: URL-friendly category identifier.
        parent:
          type: integer
          description: Parent category ID for nested categories.
        description:
          type: string
          description: Category description.
        display:
          type: string
          description: Category archive display type.
          enum: [default, products, subcategories, both]
    Product:
      type: object
      description: A WooCommerce product in the store catalog.
      properties:
        id:
          type: integer
          description: Product unique identifier.
        name:
          type: string
          description: Product name.
        slug:
          type: string
          description: URL-friendly product identifier.
        permalink:
          type: string
          format: uri
          description: Product URL on the storefront.
        type:
          type: string
          description: Product type. Options: simple, grouped, external, variable.
          enum: [simple, grouped, external, variable]
        status:
          type: string
          description: Product status. Options: draft, pending, private, publish.
          enum: [draft, pending, private, publish]
        featured:
          type: boolean
          description: Whether the product is featured.
        description:
          type: string
          description: Full product description (HTML allowed).
        short_description:
          type: string
          description: Short product description (HTML allowed).
        sku:
          type: string
          description: Stock-keeping unit identifier.
        price:
          type: string
          description: Current product price as a decimal string.
        regular_price:
          type: string
          description: Regular product price as a decimal string.
        sale_price:
          type: string
          description: Sale price as a decimal string. Empty string when not on sale.
        on_sale:
          type: boolean
          description: Whether the product is on sale.
        purchasable:
          type: boolean
          description: Whether the product can be bought.
        total_sales:
          type: integer
          description: Total number of sales for the product.
        virtual:
          type: boolean
          description: Whether the product is virtual (no shipping required).
        downloadable:
          type: boolean
          description: Whether the product is downloadable.
        manage_stock:
          type: boolean
          description: Whether stock management is enabled for this product.
        stock_quantity:
          type: integer
          description: Stock quantity when manage_stock is true.
          nullable: true
        stock_status:
          type: string
          description: Stock status. Options: instock, outofstock, onbackorder.
          enum: [instock, outofstock, onbackorder]
        weight:
          type: string
          description: Product weight as a string in the store weight unit.
        dimensions:
          type: object
          description: Product dimensions.
          properties:
            length:
              type: string
              description: Product length.
            width:
              type: string
              description: Product width.
            height:
              type: string
              description: Product height.
        categories:
          type: array
          description: Categories assigned to the product.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Category ID.
              name:
                type: string
                description: Category name.
              slug:
                type: string
                description: Category slug.
        tags:
          type: array
          description: Tags assigned to the product.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Tag ID.
              name:
                type: string
                description: Tag name.
              slug:
                type: string
                description: Tag slug.
        images:
          type: array
