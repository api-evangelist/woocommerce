      description: Removes a single cart item identified by its key.
      tags:
      - Cart
      parameters:
      - $ref: '#/components/parameters/key'
      - $ref: '#/components/parameters/nonce'
      responses:
        '200':
          description: Cart item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
              examples:
                deleteCartItem200Example:
                  summary: Default deleteCartItem 200 response
                  x-microcks-default: true
                  value:
                    key: string-value
                    id: 1
                    quantity: 1
                    variation_id: 1
                    item_data:
                    - name: Example Name
                      value: string-value
                      display: string-value
                    prices:
                      price: string-value
                      regular_price: string-value
                      sale_price: string-value
                      price_range:
                        min_amount: string-value
                        max_amount: string-value
                      currency_code: string-value
                      currency_symbol: string-value
                      currency_decimal_separator: string-value
                      currency_thousand_separator: string-value
                      currency_prefix: string-value
                      currency_suffix: string-value
                    name: Example Name
                    short_description: A sample description
                    images:
                    - string-value
                    low_stock_remaining: 1
