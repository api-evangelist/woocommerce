components:
  parameters:
    id:
      name: id
      in: path
      description: Unique identifier for the resource.
      required: true
      schema:
        type: integer
    key:
      name: key
      in: path
      description: Unique cart item key.
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Current page of the collection.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      description: Maximum number of items per page (maximum 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    search:
      name: search
      in: query
      description: Search term to filter results.
      required: false
      schema:
        type: string
    nonce:
      name: Nonce
      in: header
      description: >-
        Store API nonce token obtained from the X-WC-Store-API-Nonce response
        header of a prior cart GET request. Required for all cart and checkout
        write operations to prevent CSRF.
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: The customer must be logged in to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request contains invalid or missing parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Error response returned when a request fails.
      properties:
        code:
          type: string
          description: Machine-readable error code.
          example: string-value
        message:
          type: string
          description: Human-readable error message.
          example: string-value
        data:
          type: object
          description: Additional context including HTTP status.
          properties:
            status:
              type: integer
              description: HTTP status code.
          example: *id017
    StoreProductImage:
      type: object
      description: Product image with thumbnail variants.
