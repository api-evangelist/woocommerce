openapi: 3.1.0
info:
  title: WooCommerce Store API
  description: >-
    The WooCommerce Store API provides unauthenticated public REST endpoints for
    building customer-facing cart, checkout, and product functionality. Unlike
    the authenticated REST API, it is designed for frontend integrations and
    does not expose sensitive store data or other customers' information. The API
    is accessible under the /wp-json/wc/store/v1/ namespace and covers products,
    product categories, attributes, tags, brands, reviews, cart operations,
    checkout, and current customer orders. It uses cookie-based sessions to
    scope cart and checkout state to the active shopper. Write operations (cart
    mutations, checkout) require a nonce token obtained from the cart response
    and passed as the Nonce header.
  version: 'v1'
  contact:
    name: WooCommerce Developer Support
    url: https://developer.woocommerce.com/docs/apis/store-api/
  termsOfService: https://woocommerce.com/terms-conditions/
externalDocs:
  description: WooCommerce Store API Documentation
  url: https://developer.woocommerce.com/docs/apis/store-api/
servers:
  - url: https://example.com/wp-json/wc/store/v1
    description: Production Server (replace example.com with your store domain)
tags:
  - name: Products
    description: Browse products available in the store catalog
  - name: Product Categories
    description: Retrieve product categories for navigation and filtering
  - name: Product Attributes
    description: Retrieve global product attributes and their terms for filtering
  - name: Product Tags
    description: Retrieve product tags for filtering
  - name: Product Reviews
    description: Retrieve customer reviews on products
  - name: Cart
    description: Manage the current shopper's cart session including items, coupons, and shipping
  - name: Checkout
    description: Submit and manage the checkout process for the current shopper
  - name: Orders
    description: Retrieve orders belonging to the currently authenticated customer
paths:
  /products:
    get:
      operationId: listStoreProducts
      summary: List products
      description: >-
        Returns a paginated list of published products available for purchase.
        Supports filtering by category, tag, attribute, price range, on-sale
        status, featured status, and keyword search. This endpoint is public
        and requires no authentication.
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - $ref: '#/components/parameters/search'
        - name: category
          in: query
          description: Filter products by category slug.
          required: false
          schema:
            type: string
        - name: tag
          in: query
          description: Filter products by tag slug.
          required: false
          schema:
            type: string
        - name: on_sale
          in: query
          description: Return only on-sale products when true.
          required: false
          schema:
            type: boolean
        - name: featured
          in: query
          description: Return only featured products when true.
          required: false
          schema:
            type: boolean
        - name: min_price
          in: query
          description: Minimum product price filter.
          required: false
          schema:
            type: string
        - name: max_price
          in: query
          description: Maximum product price filter.
          required: false
          schema:
            type: string
        - name: stock_status
          in: query
          description: Filter by stock status. Options: instock, outofstock, onbackorder.
          required: false
          schema:
            type: string
            enum: [instock, outofstock, onbackorder]
        - name: orderby
          in: query
          description: >-
            Sort products by field. Options: date, id, include, title, slug,
            price, popularity, rating, menu_order.
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: Sort direction. Options: asc, desc.
          required: false
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated list of store products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreProduct'
  /products/{id}:
    get:
      operationId: getStoreProduct
      summary: Retrieve a product
      description: >-
        Returns a single published product by its numeric ID. Includes pricing,
        stock status, images, categories, tags, and available variations for
        variable products. Public endpoint requiring no authentication.
      tags:
        - Products
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Store product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProduct'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/collection-data:
    get:
      operationId: getProductCollectionData
      summary: Get product collection data
      description: >-
        Returns aggregate data about a product collection including price ranges,
        attribute counts, and category counts. Used to populate filter widgets on
        shop and category archive pages without fetching full product records.
      tags:
        - Products
      parameters:
        - name: calculate_price_range
          in: query
          description: Whether to calculate and return the min/max price range.
          required: false
          schema:
            type: boolean
        - name: calculate_attribute_counts
          in: query
          description: >-
            Comma-separated list of attribute slugs to count active terms for
            filter UIs.
          required: false
          schema:
            type: string
        - name: calculate_rating_counts
          in: query
          description: Whether to calculate and return review rating counts.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Product collection aggregate data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionData'
  /products/categories:
    get:
      operationId: listStoreProductCategories
      summary: List product categories
      description: >-
        Returns all product categories for storefront navigation and filtering.
        Only categories containing visible products are returned by default.
        Public endpoint requiring no authentication.
      tags:
        - Product Categories
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: hide_empty
          in: query
          description: Hide categories with no visible products.
          required: false
          schema:
            type: boolean
            default: true
        - name: parent
          in: query
          description: Limit to children of a specific category ID.
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: List of product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreProductCategory'
  /products/attributes:
    get:
      operationId: listStoreProductAttributes
      summary: List product attributes
      description: >-
        Returns all global product attributes registered in the store. Used to
        build attribute-based filters and variation selectors on the storefront.
      tags:
        - Product Attributes
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of product attributes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreProductAttribute'
  /products/attributes/{id}:
    get:
      operationId: getStoreProductAttribute
      summary: Retrieve a product attribute
      description: Returns a single product attribute by its numeric ID.
      tags:
        - Product Attributes
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Product attribute details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreProductAttribute'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/attributes/{id}/terms:
    get:
      operationId: listStoreProductAttributeTerms
      summary: List product attribute terms
      description: >-
        Returns all terms (options) for a specific product attribute. Used to
        populate attribute-based filter dropdowns and swatches on the storefront.
      tags:
        - Product Attributes
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of attribute terms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeTerm'
        '404':
          $ref: '#/components/responses/NotFound'
  /products/brands:
    get:
      operationId: listStoreProductBrands
      summary: List product brands
      description: >-
        Returns all product brands registered in the store. Brand support
        requires WooCommerce Brands or a compatible extension.
      tags:
        - Product Attributes
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of product brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreBrand'
  /products/tags:
    get:
      operationId: listStoreProductTags
      summary: List product tags
      description: Returns all product tags used in the store catalog.
      tags:
        - Product Tags
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of product tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreProductTag'
  /products/reviews:
    get:
      operationId: listStoreProductReviews
      summary: List product reviews
      description: >-
        Returns published product reviews. Can be filtered by product ID and
        star rating. Public endpoint requiring no authentication.
      tags:
        - Product Reviews
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - name: product_id
          in: query
          description: Filter reviews by product ID.
          required: false
          schema:
            type: integer
        - name: rating
          in: query
          description: Filter reviews by star rating (1-5).
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          description: List of product reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreReview'
  /cart:
    get:
      operationId: getCart
      summary: Get the current cart
      description: >-
        Returns the current customer's cart contents including items, coupons,
        fees, totals, and available shipping rates. The response also includes
        a nonce token in the X-WC-Store-API-Nonce header (and body) required for
        write operations.
      tags:
        - Cart
      responses:
        '200':
          description: Cart contents and totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
  /cart/add-item:
    post:
      operationId: addCartItem
      summary: Add an item to the cart
      description: >-
        Adds a product or variation to the cart. Requires a product_id, an
        optional variation_id, and quantity. Custom item data can be passed via
        the item_data array. Requires the Nonce header from a prior cart GET.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemInput'
      responses:
        '200':
          description: Updated cart after adding item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/remove-item:
    post:
      operationId: removeCartItem
      summary: Remove an item from the cart
      description: >-
        Removes a cart item identified by its unique cart item key. Requires the
        Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
              properties:
                key:
                  type: string
                  description: The unique cart item key to remove.
      responses:
        '200':
          description: Updated cart after removing item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/update-item:
    post:
      operationId: updateCartItem
      summary: Update a cart item quantity
      description: >-
        Updates the quantity of a cart item identified by its key. Set quantity
        to 0 to remove the item. Requires the Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - quantity
              properties:
                key:
                  type: string
                  description: Cart item key to update.
                quantity:
                  type: integer
                  description: New quantity. Set to 0 to remove the item.
                  minimum: 0
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/apply-coupon:
    post:
      operationId: applyCartCoupon
      summary: Apply a coupon to the cart
      description: >-
        Applies a coupon code to the current cart session. Returns an error if
        the coupon is invalid, expired, or does not meet usage conditions.
        Requires the Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Coupon code to apply to the cart.
      responses:
        '200':
          description: Updated cart with coupon applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/remove-coupon:
    post:
      operationId: removeCartCoupon
      summary: Remove a coupon from the cart
      description: >-
        Removes a previously applied coupon code from the cart. Requires the
        Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Coupon code to remove from the cart.
      responses:
        '200':
          description: Updated cart with coupon removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/update-customer:
    post:
      operationId: updateCartCustomer
      summary: Update cart customer data
      description: >-
        Updates billing and/or shipping address information for the current cart
        session. Used to recalculate shipping rates and taxes based on the
        customer's location. Requires the Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartCustomerInput'
      responses:
        '200':
          description: Updated cart with recalculated rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/select-shipping-rate:
    post:
      operationId: selectCartShippingRate
      summary: Select a shipping rate for the cart
      description: >-
        Selects a specific shipping rate from those available for the customer's
        shipping address. Requires the Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - package_id
                - rate_id
              properties:
                package_id:
                  type: integer
                  description: The shipping package index to update.
                rate_id:
                  type: string
                  description: The ID of the shipping rate to select.
      responses:
        '200':
          description: Updated cart with selected shipping rate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
  /cart/items:
    get:
      operationId: listCartItems
      summary: List cart items
      description: Returns a list of all items currently in the cart session.
      tags:
        - Cart
      responses:
        '200':
          description: List of cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
    delete:
      operationId: clearCartItems
      summary: Clear all cart items
      description: Removes all items from the current cart. Requires the Nonce header.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/nonce'
      responses:
        '200':
          description: Empty cart after clearing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItem'
  /cart/items/{key}:
    get:
      operationId: getCartItem
      summary: Get a cart item
      description: Returns a single cart item by its unique key.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Cart item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCartItemByKey
      summary: Update a cart item by key
      description: Updates the quantity or data of a specific cart item.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer
                  description: Updated quantity for the cart item.
                  minimum: 1
      responses:
        '200':
          description: Updated cart item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCartItem
      summary: Delete a cart item by key
      description: Removes a single cart item identified by its key.
      tags:
        - Cart
      parameters:
        - $ref: '#/components/parameters/key'
        - $ref: '#/components/parameters/nonce'
      responses:
        '200':
          description: Cart item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /checkout:
    get:
      operationId: getCheckout
      summary: Get checkout data
      description: >-
        Returns the current checkout state including the cart contents, available
        payment methods, and pre-filled billing and shipping fields from the
        customer's account.
      tags:
        - Checkout
      responses:
        '200':
          description: Checkout data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
    post:
      operationId: processCheckout
      summary: Process checkout and place order
      description: >-
        Submits the checkout form to create an order and process payment.
        Requires billing address, payment method, and optional shipping data.
        Requires the Nonce header. Returns the created order on success or
        redirects to the payment gateway for hosted gateways.
      tags:
        - Checkout
      parameters:
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '200':
          description: Order created and payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          description: Payment required or payment processing failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /checkout/{id}:
    get:
      operationId: getCheckoutOrder
      summary: Get a checkout order
      description: >-
        Returns an order placed via checkout identified by its numeric ID.
        Only accessible for the order owner or a store administrator.
      tags:
        - Checkout
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Checkout order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateCheckoutOrder
      summary: Update a pending checkout order
      description: >-
        Updates billing, shipping, or payment method on a pending order before
        payment is confirmed. Requires the Nonce header.
      tags:
        - Checkout
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/nonce'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '200':
          description: Updated checkout order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /order/{id}:
    get:
      operationId: getStoreOrder
      summary: Retrieve a customer order
      description: >-
        Returns a single order by ID. Only returns orders belonging to the
        currently authenticated customer. Used for order confirmation and
        account order history pages.
      tags:
        - Orders
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Customer order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    id:
      name: id
      in: path
      description: Unique identifier for the resource.
      required: true
      schema:
        type: integer
    key:
      name: key
      in: path
      description: Unique cart item key.
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      description: Current page of the collection.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      description: Maximum number of items per page (maximum 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    search:
      name: search
      in: query
      description: Search term to filter results.
      required: false
      schema:
        type: string
    nonce:
      name: Nonce
      in: header
      description: >-
        Store API nonce token obtained from the X-WC-Store-API-Nonce response
        header of a prior cart GET request. Required for all cart and checkout
        write operations to prevent CSRF.
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: The customer must be logged in to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request contains invalid or missing parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: Error response returned when a request fails.
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          description: Additional context including HTTP status.
          properties:
            status:
              type: integer
              description: HTTP status code.
    StoreProductImage:
      type: object
      description: Product image with thumbnail variants.
      properties:
        id:
          type: integer
          description: Image attachment ID.
        src:
          type: string
          format: uri
          description: Full-size image URL.
        thumbnail:
          type: string
          format: uri
          description: Thumbnail image URL.
        srcset:
          type: string
          description: Responsive image srcset attribute value.
        sizes:
          type: string
          description: Responsive image sizes attribute value.
        name:
          type: string
          description: Image file name.
        alt:
          type: string
          description: Image alternative text.
    StoreProductPrice:
      type: object
      description: Formatted price information for a product or variation.
      properties:
        price:
          type: string
          description: Current price as a formatted string with currency symbol.
        regular_price:
          type: string
          description: Regular price as a formatted string.
        sale_price:
          type: string
          description: Sale price as a formatted string (empty when not on sale).
        price_range:
          type: object
          description: Price range for variable products.
          nullable: true
          properties:
            min_amount:
              type: string
              description: Minimum variation price.
            max_amount:
              type: string
              description: Maximum variation price.
        currency_code:
          type: string
          description: ISO 4217 currency code.
        currency_symbol:
          type: string
          description: Currency symbol.
        currency_decimal_separator:
          type: string
          description: Decimal separator character.
        currency_thousand_separator:
          type: string
          description: Thousands separator character.
        currency_prefix:
          type: string
          description: Currency prefix (e.g. $).
        currency_suffix:
          type: string
          description: Currency suffix.
    StoreProduct:
      type: object
      description: A store product returned by the public Store API.
      properties:
        id:
          type: integer
          description: Product unique identifier.
        name:
          type: string
          description: Product name.
        slug:
          type: string
          description: URL-friendly product slug.
        parent:
          type: integer
          description: Parent product ID for variations.
        type:
          type: string
          description: Product type (simple, variable, grouped, external).
        variation:
          type: string
          description: Variation description for variation-type products.
        permalink:
          type: string
          format: uri
          description: Full URL to the product page.
        sku:
          type: string
          description: Product SKU.
        short_description:
          type: string
          description: Short product description (HTML).
        description:
          type: string
          description: Full product description (HTML).
        on_sale:
          type: boolean
          description: Whether the product is on sale.
        prices:
          $ref: '#/components/schemas/StoreProductPrice'
        purchasable:
          type: boolean
          description: Whether the product can be purchased.
        images:
          type: array
          description: Product images.
          items:
            $ref: '#/components/schemas/StoreProductImage'
        categories:
          type: array
          description: Categories assigned to the product.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Category ID.
              name:
                type: string
                description: Category name.
              slug:
                type: string
                description: Category slug.
              link:
                type: string
                format: uri
                description: Category archive URL.
        tags:
          type: array
          description: Tags assigned to the product.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Tag ID.
              name:
                type: string
                description: Tag name.
              slug:
                type: string
                description: Tag slug.
              link:
                type: string
                format: uri
                description: Tag archive URL.
        attributes:
          type: array
          description: Product attributes.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Attribute ID.
              name:
                type: string
                description: Attribute name.
              taxonomy:
                type: string
                description: Attribute taxonomy slug.
              has_variations:
                type: boolean
                description: Whether this attribute is used for variations.
              terms:
                type: array
                description: Attribute terms.
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Term ID.
                    name:
                      type: string
                      description: Term name.
                    slug:
                      type: string
                      description: Term slug.
        average_rating:
          type: string
          description: Average product rating as a decimal string.
        review_count:
          type: integer
          description: Number of approved reviews.
        is_in_stock:
          type: boolean
          description: Whether the product is in stock.
        low_stock_remaining:
          type: integer
          description: Remaining stock quantity when low stock notice is applicable.
          nullable: true
        sold_individually:
          type: boolean
          description: Whether the product must be bought individually.
        add_to_cart:
          type: object
          description: Add-to-cart action details.
          properties:
            text:
              type: string
              description: Button label text.
            description:
              type: string
              description: Accessible button description.
            url:
              type: string
              format: uri
              description: Add-to-cart URL for non-AJAX contexts.
    StoreProductCategory:
      type: object
      description: A product category for storefront display.
      properties:
        id:
          type: integer
          description: Category unique identifier.
        name:
          type: string
          description: Category display name.
        slug:
          type: string
          description: URL-friendly category slug.
        description:
          type: string
          description: Category description.
        parent:
          type: integer
          description: Parent category ID (0 for root categories).
        count:
          type: integer
          description: Number of products in this category.
        link:
          type: string
          format: uri
          description: Category archive URL.
        image:
          $ref: '#/components/schemas/StoreProductImage'
    StoreProductAttribute:
      type: object
      description: A global product attribute for filtering and variation selection.
      properties:
        id:
          type: integer
          description: Attribute unique identifier.
        name:
          type: string
          description: Attribute label.
        taxonomy:
          type: string
          description: Attribute taxonomy slug (e.g. pa_color).
        has_archives:
          type: boolean
          description: Whether the attribute has archive pages.
        order:
          type: string
          description: How terms in this attribute are ordered (menu_order, name, name_num, id).
        count:
          type: integer
          description: Number of terms in this attribute.
    AttributeTerm:
      type: object
      description: A term (option value) for a product attribute.
      properties:
        id:
          type: integer
          description: Term unique identifier.
        name:
          type: string
          description: Term display name.
        slug:
          type: string
          description: URL-friendly term slug.
        description:
          type: string
          description: Term description.
        count:
          type: integer
          description: Number of products using this term.
    StoreBrand:
      type: object
      description: A product brand.
      properties:
        id:
          type: integer
          description: Brand unique identifier.
        name:
          type: string
          description: Brand display name.
        slug:
          type: string
          description: URL-friendly brand slug.
        description:
          type: string
          description: Brand description.
        image:
          $ref: '#/components/schemas/StoreProductImage'
    StoreProductTag:
      type: object
      description: A product tag used for labeling and filtering.
      properties:
        id:
          type: integer
          description: Tag unique identifier.
        name:
          type: string
          description: Tag display name.
        slug:
          type: string
          description: URL-friendly tag slug.
        description:
          type: string
          description: Tag description.
        count:
          type: integer
          description: Number of products with this tag.
        link:
          type: string
          format: uri
          description: Tag archive URL.
    StoreReview:
      type: object
      description: A customer review on a product.
      properties:
        id:
          type: integer
          description: Review unique identifier.
        date_created:
          type: string
          format: date-time
          description: Date the review was submitted.
        product_id:
          type: integer
          description: ID of the reviewed product.
        reviewer:
          type: string
          description: Reviewer display name.
        review:
          type: string
          description: Review text content.
        rating:
          type: integer
          description: Star rating from 1 to 5.
          minimum: 1
          maximum: 5
        verified:
          type: boolean
          description: Whether the reviewer purchased the product.
    CartTotals:
      type: object
      description: Cart financial totals including subtotal, taxes, shipping, and grand total.
      properties:
        total_items:
          type: string
          description: Subtotal of all items before discounts.
        total_items_tax:
          type: string
          description: Total item tax.
        total_fees:
          type: string
          description: Total of all cart fees.
        total_fees_tax:
          type: string
          description: Total tax on fees.
        total_discount:
          type: string
          description: Total discount applied by coupons.
        total_discount_tax:
          type: string
          description: Tax on total discount.
        total_shipping:
          type: string
          description: Total shipping cost.
        total_shipping_tax:
          type: string
          description: Tax on shipping.
        total_price:
          type: string
          description: Grand total including tax.
        total_tax:
          type: string
          description: Total tax amount.
        tax_lines:
          type: array
          description: Individual tax breakdown by rate.
          items:
            type: object
            properties:
              name:
                type: string
                description: Tax rate label.
              price:
                type: string
                description: Tax amount for this rate.
              rate:
                type: string
                description: Tax rate percentage.
    CartItem:
      type: object
      description: A product item in the cart.
      properties:
        key:
          type: string
          description: Unique cart item key.
        id:
          type: integer
          description: Product ID.
        quantity:
          type: integer
          description: Quantity in cart.
        variation_id:
          type: integer
          description: Variation ID (0 for simple products).
        item_data:
          type: array
          description: Custom item data (e.g. variation attributes).
          items:
            type: object
            properties:
              name:
                type: string
                description: Data field name.
              value:
                type: string
                description: Data field value.
              display:
                type: string
                description: Formatted display value.
        prices:
          $ref: '#/components/schemas/StoreProductPrice'
        name:
          type: string
          description: Product name at time of cart addition.
        short_description:
          type: string
          description: Product short description.
        images:
          type: array
          description: Product images.
          items:
            $ref: '#/components/schemas/StoreProductImage'
        low_stock_remaining:
          type: integer
          description: Low stock quantity threshold remaining.
          nullable: true
        sold_individually:
          type: boolean
          description: Whether the product can only be purchased once per order.
    CartShippingRate:
      type: object
      description: A shipping rate option available for the cart.
      properties:
        package_id:
          type: integer
          description: Shipping package index.
        name:
          type: string
          description: Shipping package name.
        destination:
          type: object
          description: Shipping destination address.
          properties:
            address_1:
              type: string
              description: Address line 1.
            address_2:
              type: string
              description: Address line 2.
            city:
              type: string
              description: City.
            state:
              type: string
              description: State code.
            postcode:
              type: string
              description: Postcode.
            country:
              type: string
              description: Country code.
        items:
          type: array
          description: Cart items in this shipping package.
          items:
            type: object
            properties:
              key:
                type: string
                description: Cart item key.
              name:
                type: string
                description: Product name.
              quantity:
                type: integer
                description: Item quantity.
        shipping_rates:
          type: array
          description: Available shipping rates for this package.
          items:
            type: object
            properties:
              rate_id:
                type: string
                description: Shipping rate unique ID.
              name:
                type: string
                description: Shipping rate display name.
              description:
                type: string
                description: Shipping rate description.
              price:
                type: string
                description: Shipping cost as a decimal string.
              taxes:
                type: string
                description: Shipping tax as a decimal string.
              selected:
                type: boolean
                description: Whether this rate is currently selected.
              meta_data:
                type: array
                description: Additional rate metadata.
                items:
                  type: object
    Cart:
      type: object
      description: The current customer's cart state.
      properties:
        items:
          type: array
          description: Items in the cart.
          items:
            $ref: '#/components/schemas/CartItem'
        coupons:
          type: array
          description: Coupons applied to the cart.
          items:
            type: object
            properties:
              code:
                type: string
                description: Coupon code.
              discount_type:
                type: string
                description: Type of discount applied.
              totals:
                type: object
                description: Coupon discount totals.
        fees:
          type: array
          description: Additional fees added to the cart.
          items:
            type: object
            properties:
              id:
                type: string
                description: Fee ID.
              name:
                type: string
                description: Fee name.
              totals:
                type: object
                description: Fee amount totals.
        totals:
          $ref: '#/components/schemas/CartTotals'
        shipping_rates:
          type: array
          description: Available shipping rate packages.
          items:
            $ref: '#/components/schemas/CartShippingRate'
        billing_address:
          $ref: '#/components/schemas/StoreAddress'
        shipping_address:
          $ref: '#/components/schemas/StoreAddress'
        has_calculated_shipping:
          type: boolean
          description: Whether shipping has been calculated for the cart.
        needs_payment:
          type: boolean
          description: Whether the cart total requires payment.
        needs_shipping:
          type: boolean
          description: Whether any items in the cart require shipping.
        items_count:
          type: integer
          description: Total number of items in the cart.
        items_weight:
          type: number
          description: Total weight of all items in the cart.
        cross_sells:
          type: array
          description: Cross-sell product suggestions.
          items:
            $ref: '#/components/schemas/StoreProduct'
        errors:
          type: array
          description: Cart validation errors.
          items:
            type: object
            properties:
              code:
                type: string
                description: Error code.
              message:
                type: string
                description: Error message.
    AddCartItemInput:
      type: object
      description: Input for adding an item to the cart.
      required:
        - id
        - quantity
      properties:
        id:
          type: integer
          description: Product ID to add.
        quantity:
          type: integer
          description: Quantity to add.
          minimum: 1
        variation_id:
          type: integer
          description: Variation ID for variable products.
        variation:
          type: array
          description: Attribute key-value pairs for the variation.
          items:
            type: object
            properties:
              attribute:
                type: string
                description: Attribute name.
              value:
                type: string
                description: Selected attribute value.
        item_data:
          type: array
          description: Additional custom item data.
          items:
            type: object
            properties:
              name:
                type: string
                description: Data key name.
              value:
                type: string
                description: Data value.
    StoreAddress:
      type: object
      description: A customer billing or shipping address in the Store API context.
      properties:
        first_name:
          type: string
          description: First name.
        last_name:
          type: string
          description: Last name.
        company:
          type: string
          description: Company name.
        address_1:
          type: string
          description: Address line 1.
        address_2:
          type: string
          description: Address line 2.
        city:
          type: string
          description: City.
        state:
          type: string
          description: State or province code.
        postcode:
          type: string
          description: Postal code.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        email:
          type: string
          format: email
          description: Email address (billing only).
        phone:
          type: string
          description: Phone number.
    CartCustomerInput:
      type: object
      description: Customer address data for cart shipping/tax calculation.
      properties:
        billing_address:
          $ref: '#/components/schemas/StoreAddress'
        shipping_address:
          $ref: '#/components/schemas/StoreAddress'
    CheckoutInput:
      type: object
      description: Input payload for submitting or updating a checkout.
      required:
        - billing_address
        - payment_method
      properties:
        billing_address:
          $ref: '#/components/schemas/StoreAddress'
        shipping_address:
          $ref: '#/components/schemas/StoreAddress'
        customer_note:
          type: string
          description: Optional note from the customer.
        create_account:
          type: boolean
          description: Whether to create a new customer account on checkout.
        payment_method:
          type: string
          description: Payment method ID to use for this order.
        payment_data:
          type: array
          description: Additional payment gateway data (e.g. token, nonce).
          items:
            type: object
            properties:
              key:
                type: string
                description: Payment data key.
              value:
                type: string
                description: Payment data value.
    CheckoutOrder:
      type: object
      description: An order created or retrieved via the Store API checkout flow.
      properties:
        id:
          type: integer
          description: Order unique identifier.
        status:
          type: string
          description: Order status.
        order_key:
          type: string
          description: Order key for ownership verification.
        order_number:
          type: string
          description: Human-readable order number.
        customer_note:
          type: string
          description: Customer note on the order.
        billing_address:
          $ref: '#/components/schemas/StoreAddress'
        shipping_address:
          $ref: '#/components/schemas/StoreAddress'
        payment_method:
          type: string
          description: Payment method ID.
        payment_result:
          type: object
          description: Result of payment processing.
          properties:
            payment_status:
              type: string
              description: Payment result status (success, pending, failure).
            payment_details:
              type: array
              description: Gateway-specific payment result details.
              items:
                type: object
            redirect_url:
              type: string
              format: uri
              description: URL to redirect the customer to after checkout.
    Checkout:
      type: object
      description: Current checkout state.
      properties:
        order_id:
          type: integer
          description: Pending order ID if one exists.
        billing_address:
          $ref: '#/components/schemas/StoreAddress'
        shipping_address:
          $ref: '#/components/schemas/StoreAddress'
        payment_methods:
          type: array
          description: Available payment methods at checkout.
          items:
            type: object
            properties:
              id:
                type: string
                description: Payment method ID.
              title:
                type: string
                description: Payment method display title.
              description:
                type: string
                description: Payment method description shown at checkout.
    ProductCollectionData:
      type: object
      description: Aggregate data about a filtered product collection.
      properties:
        price_range:
          type: object
          description: Minimum and maximum prices in the collection.
          nullable: true
          properties:
            min_price:
              type: string
              description: Minimum product price.
            max_price:
              type: string
              description: Maximum product price.
        attribute_counts:
          type: array
          description: Term counts for requested attributes.
          items:
            type: object
            properties:
              term:
                type: integer
                description: Term ID.
              count:
                type: integer
                description: Number of products with this term.
        rating_counts:
          type: array
          description: Product counts by star rating.
          items:
            type: object
            properties:
              rating:
                type: integer
                description: Star rating value.
              count:
                type: integer
                description: Number of products with this rating.
    StoreOrder:
      type: object
      description: A customer order retrieved via the Store API.
      properties:
        id:
          type: integer
          description: Order unique identifier.
        number:
          type: string
          description: Human-readable order number.
        status:
          type: string
          description: Order status.
        date_created:
          type: string
          format: date-time
          description: Date the order was created.
        total:
          type: string
          description: Order grand total.
        billing:
          $ref: '#/components/schemas/StoreAddress'
        shipping:
          $ref: '#/components/schemas/StoreAddress'
        items:
          type: array
          description: Items in the order.
          items:
            type: object
            properties:
              id:
                type: integer
                description: Line item ID.
              name:
                type: string
                description: Product name.
              quantity:
                type: integer
                description: Quantity ordered.
              total:
                type: string
                description: Line item total.
