openapi: 3.2.0
info:
  title: WooCommerce Store Product Tags API
  description: The WooCommerce Store API provides unauthenticated public REST endpoints for building customer-facing cart, checkout, and product functionality.
  version: v1
  contact:
    name: WooCommerce Developer Support
    url: https://developer.woocommerce.com/docs/apis/store-api/
  termsOfService: https://woocommerce.com/terms-conditions/
servers:
- url: https://example.com/wp-json/wc/store/v1
  description: Production Server (replace example.com with your store domain)
tags:
- name: Product Tags
  description: Retrieve product tags for filtering
paths:
  /products/tags:
    get:
      operationId: listStoreProductTags
      summary: WooCommerce List Product Tags
      description: Returns all product tags used in the store catalog.
      tags:
      - Product Tags
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: List of product tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreProductTag'
              examples:
                listStoreProductTags200Example:
                  summary: Default listStoreProductTags 200 response
                  x-microcks-default: true
                  value:
                  - id: 1
                    name: Example Name
                    slug: string-value
                    description: A sample description
                    count: 1
                    link: https://example.com/path
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  parameters:
    per_page:
      name: per_page
      in: query
      description: Maximum number of items per page (maximum 100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    page:
      name: page
      in: query
      description: Current page of the collection.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    StoreProductTag:
      type: object
      description: A product tag used for labeling and filtering.
      properties:
        id:
          type: integer
          description: Tag unique identifier.
          example: 1
        name:
          type: string
          description: Tag display name.
          example: Example Name
        slug:
          type: string
          description: URL-friendly tag slug.
          example: string-value
        description:
          type: string
          description: Tag description.
          example: A sample description
        count:
          type: integer
          description: Number of products with this tag.
          example: 1
        link:
          type: string
          format: uri
          description: Tag archive URL.
          example: https://example.com/path
externalDocs:
  description: WooCommerce Store API Documentation
  url: https://developer.woocommerce.com/docs/apis/store-api/
