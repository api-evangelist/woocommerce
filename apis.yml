aid: woocommerce
name: WooCommerce
description: WooCommerce is the world's most popular open-source eCommerce platform,
  built on WordPress. It provides a comprehensive REST API for managing products,
  orders, customers, coupons, reports, webhooks, and store settings, plus a public-facing
  Store API for headless frontends. WooCommerce also delivers real-time events via
  webhooks for order, product, customer, and subscription lifecycle changes.
type: Index
url: https://raw.githubusercontent.com/api-evangelist/woocommerce/refs/heads/main/apis.yml
tags:
- eCommerce
- Open Source
- Orders
- Products
- WordPress
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
created: '2026-05-03'
modified: '2026-05-19'
specificationVersion: '0.23'
access: 3rd-Party
position: Consumer
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/woocommerce.png
apis:
- aid: woocommerce:webhook-events
  name: WooCommerce Webhook Events
  description: >-
    WooCommerce delivers real-time event notifications via HTTP POST webhooks for orders, products, customers,
    coupons, and subscriptions lifecycle changes. Webhooks are configured in the WooCommerce admin or
    via the REST API and deliver JSON payloads signed with HMAC-SHA256.
  humanURL: https://woocommerce.com/document/webhooks/
  tags:
  - Events
  - Webhooks
  properties:
  - type: Documentation
    url: https://woocommerce.com/document/webhooks/
  - type: AsyncAPI
    url: asyncapi/woocommerce-webhooks-asyncapi.yml
  - type: JSONSchema
    url: json-schema/woocommerce-rest-api-webhook-schema.json
    title: Webhook Schema
- aid: woocommerce:graphql-api
  name: WooCommerce GraphQL API
  description: >-
    WooCommerce GraphQL support is provided by the WPGraphQL WooCommerce extension (WooGraphQL), an open-source
    WordPress plugin that exposes the full WooCommerce data model through a GraphQL endpoint at /graphql.
    The schema covers products (simple, variable, external, grouped), product categories, tags, attributes,
    variations, cart, coupons, orders, customers, shipping zones, tax rates, payment gateways, refunds,
    reviews, downloadable items, subscriptions, memberships, and session/nonce management. Both queries
    and mutations are supported.
  humanURL: https://woographql.com/
  baseURL: https://yoursite.com/graphql
  tags:
  - eCommerce
  - GraphQL
  - Headless
  - WordPress
  properties:
  - type: Documentation
    url: https://woographql.com/docs
  - type: GitHub
    url: https://github.com/wp-graphql/wp-graphql-woocommerce
  - type: GraphQL
    url: graphql/woocommerce-graphql.md
  - type: GraphQLSchema
    url: graphql/woocommerce-schema.graphql
