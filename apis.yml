aid: woocommerce
url: https://raw.githubusercontent.com/api-evangelist/woocommerce/refs/heads/main/apis.yml
apis:
  - aid: woocommerce:rest-api
    name: WooCommerce REST API
    tags:
      - E-Commerce
      - WordPress
      - Products
      - Orders
      - Customers
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://example.com/wp-json/wc/v3
    humanURL: https://developer.woocommerce.com/docs/apis/rest-api/
    properties:
      - url: https://developer.woocommerce.com/docs/apis/rest-api/
        type: Documentation
      - url: https://woocommerce.github.io/woocommerce-rest-api-docs/
        type: Documentation
      - url: openapi/woocommerce-rest-api-openapi.yml
        type: OpenAPI
    description: >-
      The WooCommerce REST API is the primary server-side interface for reading
      and writing WooCommerce store data programmatically. It follows REST
      conventions, uses JSON for all requests and responses, and is fully
      integrated with the WordPress REST API under the /wp-json/wc/v3/ namespace.
      The API covers a broad set of resources including products, product
      categories, product attributes, orders, order refunds, customers, coupons,
      tax rates, shipping zones, payment gateways, settings, reports, webhooks,
      and system status. Authentication is handled via API keys (Consumer Key and
      Consumer Secret) generated in the WooCommerce admin, sent over HTTPS using
      HTTP Basic Auth.

  - aid: woocommerce:store-api
    name: WooCommerce Store API
    tags:
      - E-Commerce
      - WordPress
      - Cart
      - Checkout
      - Storefront
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://example.com/wp-json/wc/store/v1
    humanURL: https://developer.woocommerce.com/docs/apis/store-api/
    properties:
      - url: https://developer.woocommerce.com/docs/apis/store-api/
        type: Documentation
      - url: openapi/woocommerce-store-api-openapi.yml
        type: OpenAPI
    description: >-
      The WooCommerce Store API provides unauthenticated public REST endpoints
      for building customer-facing cart, checkout, and product functionality.
      Unlike the authenticated REST API, it is designed for frontend integrations
      and does not expose sensitive store data or other customers' information.
      The API is accessible under the /wp-json/wc/store/v1/ namespace and covers
      products, product categories, attributes, tags, reviews, cart operations,
      checkout, and current customer orders. It uses cookie-based sessions to
      scope cart and checkout state to the active shopper, making it well-suited
      for building headless storefronts and custom block-based checkout experiences.

  - aid: woocommerce:webhooks
    name: WooCommerce Webhooks
    tags:
      - Webhooks
      - Events
      - Notifications
      - E-Commerce
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://example.com/wp-json/wc/v3
    humanURL: https://developer.woocommerce.com/docs/best-practices/urls-and-routing/webhooks/
    properties:
      - url: https://developer.woocommerce.com/docs/best-practices/urls-and-routing/webhooks/
        type: Documentation
      - url: https://woocommerce.com/document/webhooks/
        type: Documentation
      - url: asyncapi/woocommerce-webhooks-asyncapi.yml
        type: AsyncAPI
      - url: json-schema/woocommerce-webhook-schema.json
        type: JSONSchema
    description: >-
      WooCommerce Webhooks deliver HTTP POST event notifications to a configured
      URL whenever specific store events occur. Supported topics include create,
      update, and delete actions for orders, products, coupons, and customers, as
      well as custom action-based topics such as woocommerce_add_to_cart. Webhooks
      are configured through the WooCommerce admin under Settings > Advanced >
      Webhooks, or managed programmatically via the REST API /webhooks endpoints.
      Each webhook includes a configurable secret key used to generate an HMAC
      signature in the request headers for payload verification. The system
      automatically disables a webhook after five consecutive delivery failures.

  - aid: woocommerce:payment-gateway-api
    name: WooCommerce Payment Gateway API
    tags:
      - Payments
      - PHP
      - WordPress
      - Extensions
      - E-Commerce
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developer.woocommerce.com/docs/features/payments/payment-gateway-api/
    properties:
      - url: https://developer.woocommerce.com/docs/features/payments/payment-gateway-api/
        type: Documentation
    description: >-
      The WooCommerce Payment Gateway API is a PHP class-based framework for
      building custom payment method integrations as WordPress plugins. Developers
      extend the WC_Payment_Gateway base class to define payment form fields,
      handle checkout form submission, process payments with third-party processors,
      and update order statuses. The API supports multiple integration patterns
      including form-based, iframe-based, direct API calls, and offline payment
      methods. It integrates with the WooCommerce Settings API for gateway
      configuration and provides built-in order methods such as payment_complete()
      to ensure consistent stock and status management across all payment types.

  - aid: woocommerce:settings-api
    name: WooCommerce Settings API
    tags:
      - PHP
      - WordPress
      - Extensions
      - Configuration
      - Settings
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developer.woocommerce.com/docs/extensions/settings-and-config/settings-api/
    properties:
      - url: https://developer.woocommerce.com/docs/extensions/settings-and-config/settings-api/
        type: Documentation
    description: >-
      The WooCommerce Settings API is a PHP framework that enables plugin and
      extension developers to define, display, save, and load configuration
      settings within the WordPress admin interface. Developers extend the
      WC_Settings_API class and declare form fields covering input types such as
      text, textarea, checkbox, select, and multiselect. The API automatically
      generates the HTML output for the settings page, handles form submission via
      process_admin_options(), and persists values to the WordPress database. It is
      used by payment gateways, shipping methods, and other WooCommerce extensions
      to provide a standardized configuration experience without requiring custom
      settings infrastructure.

  - aid: woocommerce:shipping-method-api
    name: WooCommerce Shipping Method API
    tags:
      - Shipping
      - PHP
      - WordPress
      - Extensions
      - E-Commerce
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.example.com
    humanURL: https://developer.woocommerce.com/docs/features/shipping/shipping-method-api/
    properties:
      - url: https://developer.woocommerce.com/docs/features/shipping/shipping-method-api/
        type: Documentation
    description: >-
      The WooCommerce Shipping Method API is a PHP class-based framework for
      creating custom shipping integrations as WordPress plugins. Developers extend
      the WC_Shipping_Method base class to define shipping rate calculation logic,
      configure method settings, and add rates to the cart based on package
      contents, destination, and other cart data. Custom shipping methods appear
      alongside built-in options such as flat rate and free shipping in the
      WooCommerce checkout. The API integrates with the Settings API for
      per-instance configuration and supports shipping zones, allowing merchants
      to apply different custom methods to different geographic regions.
common:
  - url: json-ld/woocommerce-context.jsonld
    type: JSON-LD
  - url: json-schema/woocommerce-order-schema.json
    type: JSONSchema
  - url: json-schema/woocommerce-product-schema.json
    type: JSONSchema
