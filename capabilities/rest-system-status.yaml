naftiko: 1.0.0-alpha2
info:
  label: WooCommerce REST API — System Status
  description: 'WooCommerce REST API — System Status. 1 operations. Lead operation: WooCommerce Retrieve System Status. Self-contained
    Naftiko capability covering one Woocommerce business surface.'
  tags:
  - Woocommerce
  - System Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WOOCOMMERCE_API_KEY: WOOCOMMERCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-system-status
    baseUri: https://example.com/wp-json/wc/v3
    description: WooCommerce REST API — System Status business capability. Self-contained, no shared references.
    resources:
    - name: system_status
      path: /system_status
      operations:
      - name: getsystemstatus
        method: GET
        description: WooCommerce Retrieve System Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: basic
      username: '{{env.WOOCOMMERCE_USER}}'
      password: '{{env.WOOCOMMERCE_PASS}}'
  exposes:
  - type: rest
    namespace: rest-system-status-rest
    port: 8080
    description: REST adapter for WooCommerce REST API — System Status. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/system-status
      name: system-status
      description: REST surface for system_status.
      operations:
      - method: GET
        name: getsystemstatus
        description: WooCommerce Retrieve System Status
        call: rest-system-status.getsystemstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-system-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for WooCommerce REST API — System Status. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: woocommerce-retrieve-system-status
      description: WooCommerce Retrieve System Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rest-system-status.getsystemstatus
      outputParameters:
      - type: object
        mapping: $.
