naftiko: 1.0.0-alpha2
info:
  label: WooCommerce Store API — Orders
  description: 'WooCommerce Store API — Orders. 1 operations. Lead operation: WooCommerce Retrieve a Customer Order. Self-contained
    Naftiko capability covering one Woocommerce business surface.'
  tags:
  - Woocommerce
  - Orders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WOOCOMMERCE_API_KEY: WOOCOMMERCE_API_KEY
capability:
  consumes:
  - type: http
    namespace: store-orders
    baseUri: https://example.com/wp-json/wc/store/v1
    description: WooCommerce Store API — Orders business capability. Self-contained, no shared references.
    resources:
    - name: order-id
      path: /order/{id}
      operations:
      - name: getstoreorder
        method: GET
        description: WooCommerce Retrieve a Customer Order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: store-orders-rest
    port: 8080
    description: REST adapter for WooCommerce Store API — Orders. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/order/{id}
      name: order-id
      description: REST surface for order-id.
      operations:
      - method: GET
        name: getstoreorder
        description: WooCommerce Retrieve a Customer Order
        call: store-orders.getstoreorder
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: store-orders-mcp
    port: 9090
    transport: http
    description: MCP adapter for WooCommerce Store API — Orders. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: woocommerce-retrieve-customer-order
      description: WooCommerce Retrieve a Customer Order
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: store-orders.getstoreorder
      outputParameters:
      - type: object
        mapping: $.
