naftiko: "1.0.0-alpha1"

info:
  label: "WooCommerce REST API"
  description: "Server-side REST API for managing WooCommerce store data including products, orders, customers, and coupons."
  tags:
    - eCommerce
    - Orders
    - Products
    - REST
    - WooCommerce
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WOOCOMMERCE_CONSUMER_KEY: WOOCOMMERCE_CONSUMER_KEY
      WOOCOMMERCE_CONSUMER_SECRET: WOOCOMMERCE_CONSUMER_SECRET

capability:
  consumes:
    - type: http
      namespace: woo-rest
      baseUri: https://example.com/wp-json/wc/v3
      description: "WooCommerce REST API v3 for complete store management."
      authentication:
        type: basic
        username: "{{WOOCOMMERCE_CONSUMER_KEY}}"
        password: "{{WOOCOMMERCE_CONSUMER_SECRET}}"
      resources:
        - name: products
          path: /products
          description: "Manage WooCommerce products."
          operations:
            - name: list-products
              method: GET
              description: "List all products with optional filtering and pagination."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page."
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by product status."
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter by product category ID."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search term."
              outputRawFormat: json
              outputParameters:
                - name: products
                  type: array
                  value: "$."
            - name: create-product
              method: POST
              description: "Create a new WooCommerce product."
              inputParameters: []
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  type: "{{tools.type}}"
                  status: "{{tools.status}}"
                  regular_price: "{{tools.regular_price}}"
              outputRawFormat: json
              outputParameters:
                - name: product
                  type: object
                  value: "$."
            - name: get-product
              method: GET
              description: "Get a single product by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Product ID."
              outputRawFormat: json
              outputParameters:
                - name: product
                  type: object
                  value: "$."
            - name: update-product
              method: PUT
              description: "Update an existing product."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Product ID."
              body:
                type: json
                data:
                  regular_price: "{{tools.regular_price}}"
                  status: "{{tools.status}}"
              outputRawFormat: json
              outputParameters:
                - name: product
                  type: object
                  value: "$."
            - name: delete-product
              method: DELETE
              description: "Delete a product."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Product ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: orders
          path: /orders
          description: "Manage WooCommerce orders."
          operations:
            - name: list-orders
              method: GET
              description: "List all orders with optional filtering."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page."
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by order status."
                - name: customer
                  in: query
                  type: integer
                  required: false
                  description: "Filter by customer ID."
                - name: after
                  in: query
                  type: string
                  required: false
                  description: "Filter orders after date (ISO 8601)."
              outputRawFormat: json
              outputParameters:
                - name: orders
                  type: array
                  value: "$."
            - name: create-order
              method: POST
              description: "Create a new order."
              inputParameters: []
              body:
                type: json
                data:
                  payment_method: "{{tools.payment_method}}"
                  billing: "{{tools.billing}}"
                  line_items: "{{tools.line_items}}"
              outputRawFormat: json
              outputParameters:
                - name: order
                  type: object
                  value: "$."
            - name: get-order
              method: GET
              description: "Get a single order by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Order ID."
              outputRawFormat: json
              outputParameters:
                - name: order
                  type: object
                  value: "$."
            - name: update-order
              method: PUT
              description: "Update an order status or data."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Order ID."
              body:
                type: json
                data:
                  status: "{{tools.status}}"
              outputRawFormat: json
              outputParameters:
                - name: order
                  type: object
                  value: "$."

        - name: customers
          path: /customers
          description: "Manage WooCommerce customers."
          operations:
            - name: list-customers
              method: GET
              description: "List all customers."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search by email or name."
              outputRawFormat: json
              outputParameters:
                - name: customers
                  type: array
                  value: "$."
            - name: get-customer
              method: GET
              description: "Get a single customer by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Customer ID."
              outputRawFormat: json
              outputParameters:
                - name: customer
                  type: object
                  value: "$."

        - name: coupons
          path: /coupons
          description: "Manage WooCommerce discount coupons."
          operations:
            - name: list-coupons
              method: GET
              description: "List all coupons."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search by coupon code."
              outputRawFormat: json
              outputParameters:
                - name: coupons
                  type: array
                  value: "$."
            - name: create-coupon
              method: POST
              description: "Create a new discount coupon."
              inputParameters: []
              body:
                type: json
                data:
                  code: "{{tools.code}}"
                  discount_type: "{{tools.discount_type}}"
                  amount: "{{tools.amount}}"
              outputRawFormat: json
              outputParameters:
                - name: coupon
                  type: object
                  value: "$."

        - name: reports
          path: /reports/sales
          description: "Retrieve WooCommerce sales reports."
          operations:
            - name: get-sales-report
              method: GET
              description: "Get sales report summary for a date range."
              inputParameters:
                - name: period
                  in: query
                  type: string
                  required: false
                  description: "Report period: week, month, last_month, year."
                - name: date_min
                  in: query
                  type: string
                  required: false
                  description: "Start date (ISO 8601)."
                - name: date_max
                  in: query
                  type: string
                  required: false
                  description: "End date (ISO 8601)."
              outputRawFormat: json
              outputParameters:
                - name: report
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: woo-rest-api
      resources:
        - path: /v1/products
          name: products
          description: "Manage WooCommerce products."
          operations:
            - method: GET
              name: list-products
              description: "List all products."
              call: "woo-rest.list-products"
              with:
                page: "rest.page"
                per_page: "rest.per_page"
                status: "rest.status"
              outputParameters:
                - type: array
                  mapping: "$."
            - method: POST
              name: create-product
              description: "Create a new product."
              call: "woo-rest.create-product"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/orders
          name: orders
          description: "Manage WooCommerce orders."
          operations:
            - method: GET
              name: list-orders
              description: "List all orders."
              call: "woo-rest.list-orders"
              with:
                page: "rest.page"
                status: "rest.status"
              outputParameters:
                - type: array
                  mapping: "$."

        - path: /v1/customers
          name: customers
          description: "Manage customers."
          operations:
            - method: GET
              name: list-customers
              description: "List all customers."
              call: "woo-rest.list-customers"
              outputParameters:
                - type: array
                  mapping: "$."

        - path: /v1/reports/sales
          name: sales-reports
          description: "Sales analytics."
          operations:
            - method: GET
              name: get-sales-report
              description: "Get sales report."
              call: "woo-rest.get-sales-report"
              with:
                period: "rest.period"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: woo-rest-mcp
      transport: http
      tools:
        - name: list-products
          description: "List WooCommerce products with optional filtering by status, category, or search term."
          hints:
            readOnly: true
          call: "woo-rest.list-products"
          with:
            page: "tools.page"
            per_page: "tools.per_page"
            status: "tools.status"
            search: "tools.search"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-product
          description: "Get a single WooCommerce product by ID."
          hints:
            readOnly: true
          call: "woo-rest.get-product"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: create-product
          description: "Create a new WooCommerce product."
          hints:
            readOnly: false
          call: "woo-rest.create-product"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-product
          description: "Update an existing WooCommerce product."
          hints:
            readOnly: false
            idempotent: true
          call: "woo-rest.update-product"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-orders
          description: "List WooCommerce orders with optional filtering by status, customer, or date range."
          hints:
            readOnly: true
          call: "woo-rest.list-orders"
          with:
            page: "tools.page"
            per_page: "tools.per_page"
            status: "tools.status"
            customer: "tools.customer"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-order
          description: "Get a single WooCommerce order by ID."
          hints:
            readOnly: true
          call: "woo-rest.get-order"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: update-order-status
          description: "Update a WooCommerce order status."
          hints:
            readOnly: false
            idempotent: true
          call: "woo-rest.update-order"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-customers
          description: "List WooCommerce customers with optional search."
          hints:
            readOnly: true
          call: "woo-rest.list-customers"
          with:
            search: "tools.search"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-sales-report
          description: "Get WooCommerce sales report for a date range or period."
          hints:
            readOnly: true
          call: "woo-rest.get-sales-report"
          with:
            period: "tools.period"
            date_min: "tools.date_min"
            date_max: "tools.date_max"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-coupons
          description: "List WooCommerce discount coupons."
          hints:
            readOnly: true
          call: "woo-rest.list-coupons"
          with:
            search: "tools.search"
          outputParameters:
            - type: array
              mapping: "$."
