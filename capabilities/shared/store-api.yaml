naftiko: "1.0.0-alpha1"

info:
  label: "WooCommerce Store API"
  description: "Public-facing headless store API for products, cart, and checkout. No authentication required for read operations."
  tags:
    - Cart
    - Checkout
    - eCommerce
    - Headless
    - Products
    - WooCommerce
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys: {}

capability:
  consumes:
    - type: http
      namespace: woo-store
      baseUri: https://example.com/wp-json/wc/store/v1
      description: "WooCommerce Store API v1 for public storefront operations."
      resources:
        - name: products
          path: /products
          description: "Browse the public product catalog."
          operations:
            - name: list-store-products
              method: GET
              description: "List published products available for purchase."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
                - name: per_page
                  in: query
                  type: integer
                  required: false
                  description: "Items per page."
                - name: search
                  in: query
                  type: string
                  required: false
                  description: "Search term."
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Filter by category slug."
                - name: on_sale
                  in: query
                  type: boolean
                  required: false
                  description: "Return only on-sale products."
              outputRawFormat: json
              outputParameters:
                - name: products
                  type: array
                  value: "$."
            - name: get-store-product
              method: GET
              description: "Get a single product by ID."
              inputParameters:
                - name: id
                  in: path
                  type: integer
                  required: true
                  description: "Product ID."
              outputRawFormat: json
              outputParameters:
                - name: product
                  type: object
                  value: "$."

        - name: cart
          path: /cart
          description: "Manage the current shopper's cart."
          operations:
            - name: get-cart
              method: GET
              description: "Get the current shopper's cart contents."
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: cart
                  type: object
                  value: "$."
            - name: add-to-cart
              method: POST
              description: "Add an item to the cart."
              inputParameters: []
              body:
                type: json
                data:
                  id: "{{tools.product_id}}"
                  quantity: "{{tools.quantity}}"
              outputRawFormat: json
              outputParameters:
                - name: cart_item
                  type: object
                  value: "$."
            - name: remove-cart-item
              method: DELETE
              description: "Remove an item from the cart."
              inputParameters:
                - name: key
                  in: path
                  type: string
                  required: true
                  description: "Cart item key."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: checkout
          path: /checkout
          description: "Submit the checkout and place an order."
          operations:
            - name: submit-checkout
              method: POST
              description: "Submit checkout details and place an order."
              inputParameters: []
              body:
                type: json
                data:
                  payment_method: "{{tools.payment_method}}"
                  billing_address: "{{tools.billing_address}}"
                  shipping_address: "{{tools.shipping_address}}"
              outputRawFormat: json
              outputParameters:
                - name: order
                  type: object
                  value: "$."

        - name: categories
          path: /products/categories
          description: "Browse product categories."
          operations:
            - name: list-categories
              method: GET
              description: "List all product categories."
              inputParameters:
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: "Page number."
              outputRawFormat: json
              outputParameters:
                - name: categories
                  type: array
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: woo-store-rest
      resources:
        - path: /v1/products
          name: products
          description: "Browse store products."
          operations:
            - method: GET
              name: list-store-products
              description: "Browse published products."
              call: "woo-store.list-store-products"
              with:
                search: "rest.search"
                category: "rest.category"
              outputParameters:
                - type: array
                  mapping: "$."

        - path: /v1/cart
          name: cart
          description: "Manage shopper cart."
          operations:
            - method: GET
              name: get-cart
              description: "Get current cart."
              call: "woo-store.get-cart"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: woo-store-mcp
      transport: http
      tools:
        - name: browse-products
          description: "Browse products available in the WooCommerce storefront."
          hints:
            readOnly: true
          call: "woo-store.list-store-products"
          with:
            search: "tools.search"
            category: "tools.category"
            on_sale: "tools.on_sale"
          outputParameters:
            - type: array
              mapping: "$."
        - name: get-product-details
          description: "Get full details for a specific product by ID."
          hints:
            readOnly: true
          call: "woo-store.get-store-product"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: view-cart
          description: "View the current shopper's cart contents."
          hints:
            readOnly: true
          call: "woo-store.get-cart"
          outputParameters:
            - type: object
              mapping: "$."
        - name: add-product-to-cart
          description: "Add a product to the current shopper's cart."
          hints:
            readOnly: false
          call: "woo-store.add-to-cart"
          with:
            id: "tools.product_id"
            quantity: "tools.quantity"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-product-categories
          description: "List all product categories for navigation."
          hints:
            readOnly: true
          call: "woo-store.list-categories"
          outputParameters:
            - type: array
              mapping: "$."
