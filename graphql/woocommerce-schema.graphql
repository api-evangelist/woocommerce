"""
WooCommerce GraphQL Schema
Source: WPGraphQL WooCommerce (WooGraphQL)
GitHub: https://github.com/wp-graphql/wp-graphql-woocommerce
Endpoint: https://yoursite.com/graphql
"""

# ─── Scalars ──────────────────────────────────────────────────────────────────

scalar DateTime
scalar Decimal
scalar ID

# ─── Enums ────────────────────────────────────────────────────────────────────

enum StockStatus {
  IN_STOCK
  OUT_OF_STOCK
  ON_BACKORDER
}

enum BackordersAllowed {
  NO
  NOTIFY
  YES
}

enum ManageStock {
  FALSE
  NOTIFY
  TRUE
}

enum CatalogVisibility {
  CATALOG
  SEARCH
  HIDDEN
  VISIBLE
}

enum OrderStatus {
  PENDING
  PROCESSING
  ON_HOLD
  COMPLETED
  CANCELLED
  REFUNDED
  FAILED
}

enum ProductTypesEnum {
  SIMPLE
  VARIABLE
  EXTERNAL
  GROUPED
}

enum TaxStatusEnum {
  TAXABLE
  SHIPPING
  NONE
}

enum DiscountTypeEnum {
  PERCENT
  FIXED_CART
  FIXED_PRODUCT
}

enum OrdersOrderbyEnum {
  DATE
  MODIFIED
  ID
  TOTAL
  ORDER_NUMBER
}

enum OrderEnum {
  ASC
  DESC
}

# ─── Interfaces ───────────────────────────────────────────────────────────────

"""Base interface shared by all WooCommerce product types."""
interface Product {
  id: ID!
  databaseId: Int!
  name: String
  slug: String
  type: ProductTypesEnum
  status: String
  description: String
  shortDescription: String
  sku: String
  price: String
  regularPrice: String
  salePrice: String
  onSale: Boolean
  purchasable: Boolean
  totalSales: Int
  virtual: Boolean
  downloadable: Boolean
  taxStatus: TaxStatusEnum
  taxClass: String
  manageStock: ManageStock
  stockQuantity: Int
  stockStatus: StockStatus
  backorders: BackordersAllowed
  backordersAllowed: Boolean
  backordered: Boolean
  soldIndividually: Boolean
  weight: String
  reviewsAllowed: Boolean
  averageRating: Float
  reviewCount: Int
  featured: Boolean
  catalogVisibility: CatalogVisibility
  dateOnSaleFrom: DateTime
  dateOnSaleTo: DateTime
  dateCreated: DateTime
  dateModified: DateTime
  image: MediaItem
  productCategories: ProductCategoryConnection
  productTags: ProductTagConnection
  attributes: ProductAttributeConnection
  metaData: [MetaData]
}

"""Base interface for all order line items."""
interface OrderItem {
  databaseId: Int
  quantity: Int
  total: String
  totalTax: String
  metaData: [MetaData]
}

# ─── Types ────────────────────────────────────────────────────────────────────

"""WordPress media item used as product image."""
type MediaItem {
  id: ID!
  databaseId: Int!
  sourceUrl(size: MediaItemSizeEnum): String
  altText: String
  title: String
  mediaDetails: MediaDetails
}

enum MediaItemSizeEnum {
  THUMBNAIL
  MEDIUM
  MEDIUM_LARGE
  LARGE
  FULL
  WOOCOMMERCE_THUMBNAIL
  WOOCOMMERCE_SINGLE
  WOOCOMMERCE_GALLERY_THUMBNAIL
}

type MediaDetails {
  width: Int
  height: Int
  file: String
}

"""Gallery of product images."""
type Gallery {
  nodes: [MediaItem]
}

"""Price range for variable products."""
type PricingRange {
  minPrice: String
  maxPrice: String
  minRegularPrice: String
  maxRegularPrice: String
}

"""A simple (single-variation) WooCommerce product."""
type SimpleProduct implements Product {
  id: ID!
  databaseId: Int!
  name: String
  slug: String
  type: ProductTypesEnum
  status: String
  description: String
  shortDescription: String
  sku: String
  price: String
  regularPrice: String
  salePrice: String
  onSale: Boolean
  purchasable: Boolean
  totalSales: Int
  virtual: Boolean
  downloadable: Boolean
  taxStatus: TaxStatusEnum
  taxClass: String
  manageStock: ManageStock
  stockQuantity: Int
  stockStatus: StockStatus
  backorders: BackordersAllowed
  backordersAllowed: Boolean
  backordered: Boolean
  soldIndividually: Boolean
  weight: String
  reviewsAllowed: Boolean
  averageRating: Float
  reviewCount: Int
  featured: Boolean
  catalogVisibility: CatalogVisibility
  dateOnSaleFrom: DateTime
  dateOnSaleTo: DateTime
  dateCreated: DateTime
  dateModified: DateTime
  image: MediaItem
  galleryImages: Gallery
  productCategories: ProductCategoryConnection
  productTags: ProductTagConnection
  attributes: ProductAttributeConnection
  downloads: [DownloadableFile]
  downloadLimit: Int
  downloadExpiry: Int
  metaData: [MetaData]
  reviews: ReviewConnection
}

"""A variable product with multiple purchasable variations."""
type VariableProduct implements Product {
  id: ID!
  databaseId: Int!
  name: String
  slug: String
  type: ProductTypesEnum
  status: String
  description: String
  shortDescription: String
  sku: String
  price: String
  regularPrice: String
  salePrice: String
  onSale: Boolean
  purchasable: Boolean
  totalSales: Int
  virtual: Boolean
  downloadable: Boolean
  taxStatus: TaxStatusEnum
  taxClass: String
  manageStock: ManageStock
  stockQuantity: Int
  stockStatus: StockStatus
  backorders: BackordersAllowed
  backordersAllowed: Boolean
  backordered: Boolean
  soldIndividually: Boolean
  weight: String
  reviewsAllowed: Boolean
  averageRating: Float
  reviewCount: Int
  featured: Boolean
  catalogVisibility: CatalogVisibility
  dateOnSaleFrom: DateTime
  dateOnSaleTo: DateTime
  dateCreated: DateTime
  dateModified: DateTime
  image: MediaItem
  galleryImages: Gallery
  priceRange: PricingRange
  productCategories: ProductCategoryConnection
  productTags: ProductTagConnection
  attributes: ProductAttributeConnection
  variations(first: Int, after: String): ProductVariationConnection
  metaData: [MetaData]
  reviews: ReviewConnection
}

"""An external/affiliate product that links to another site."""
type ExternalProduct implements Product {
  id: ID!
  databaseId: Int!
  name: String
  slug: String
  type: ProductTypesEnum
  status: String
  description: String
  shortDescription: String
  sku: String
  price: String
  regularPrice: String
  salePrice: String
  onSale: Boolean
  purchasable: Boolean
  totalSales: Int
  virtual: Boolean
  downloadable: Boolean
  taxStatus: TaxStatusEnum
  taxClass: String
  manageStock: ManageStock
  stockQuantity: Int
  stockStatus: StockStatus
  backorders: BackordersAllowed
  backordersAllowed: Boolean
  backordered: Boolean
  soldIndividually: Boolean
  weight: String
  reviewsAllowed: Boolean
  averageRating: Float
  reviewCount: Int
  featured: Boolean
  catalogVisibility: CatalogVisibility
  dateOnSaleFrom: DateTime
  dateOnSaleTo: DateTime
  dateCreated: DateTime
  dateModified: DateTime
  image: MediaItem
  externalUrl: String
  buttonText: String
  productCategories: ProductCategoryConnection
  productTags: ProductTagConnection
  attributes: ProductAttributeConnection
  metaData: [MetaData]
}

"""A grouped product linking several related simple products."""
type GroupedProduct implements Product {
  id: ID!
  databaseId: Int!
  name: String
  slug: String
  type: ProductTypesEnum
  status: String
  description: String
  shortDescription: String
  sku: String
  price: String
  regularPrice: String
  salePrice: String
  onSale: Boolean
  purchasable: Boolean
  totalSales: Int
  virtual: Boolean
  downloadable: Boolean
  taxStatus: TaxStatusEnum
  taxClass: String
  manageStock: ManageStock
  stockQuantity: Int
  stockStatus: StockStatus
  backorders: BackordersAllowed
  backordersAllowed: Boolean
  backordered: Boolean
  soldIndividually: Boolean
  weight: String
  reviewsAllowed: Boolean
  averageRating: Float
  reviewCount: Int
  featured: Boolean
  catalogVisibility: CatalogVisibility
  dateOnSaleFrom: DateTime
  dateOnSaleTo: DateTime
  dateCreated: DateTime
  dateModified: DateTime
