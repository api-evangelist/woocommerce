# ─── Root Query ───────────────────────────────────────────────────────────────

type Query {
  """Fetch a single product by ID or slug."""
  product(id: ID, idType: ProductIdTypeEnum, slug: String): Product

  """Fetch a list of products with optional filtering."""
  products(
    first: Int
    last: Int
    after: String
    before: String
    where: ProductsWhereArgs
  ): ProductConnection

  """Fetch a product variation by ID."""
  productVariation(id: ID, idType: ProductVariationIdTypeEnum): ProductVariation

  """Fetch a product category by ID or slug."""
  productCategory(id: ID, idType: ProductCategoryIdTypeEnum): ProductCategory

  """Fetch all product categories."""
  productCategories(
    first: Int
    after: String
    where: ProductCategoryWhereArgs
  ): ProductCategoryConnection

  """Fetch a product tag by ID or slug."""
  productTag(id: ID, idType: ProductTagIdTypeEnum): ProductTag

  """Fetch all product tags."""
  productTags(first: Int, after: String): ProductTagConnection

  """Fetch all globally defined product attributes."""
  globalProductAttributes(first: Int): ProductAttributeConnection

  """Fetch the current customer's cart."""
  cart: Cart

  """Fetch a single coupon by ID or code."""
  coupon(id: ID, idType: CouponIdTypeEnum): Coupon

  """Fetch all coupons."""
  coupons(first: Int, after: String): CouponConnection

  """Fetch a single order by ID or order number."""
  order(id: ID, idType: OrderIdTypeEnum): Order

  """Fetch orders with optional filtering (requires auth)."""
  orders(
    first: Int
    after: String
    where: OrdersWhereArgs
  ): OrderConnection

  """Fetch a single customer by ID or email."""
  customer(id: ID, idType: CustomerIdTypeEnum): Customer

  """Fetch all customers (requires admin)."""
  customers(first: Int, after: String): CustomerConnection

  """Fetch all shipping zones."""
  shippingZones: [ShippingZone]

  """Fetch a single shipping zone."""
  shippingZone(id: ID!): ShippingZone

  """Fetch all tax rates."""
  taxRates(first: Int, after: String): TaxRateConnection

  """Fetch all tax classes."""
  taxClasses: [TaxClass]

  """Fetch all active payment gateways."""
  paymentGateways(all: Boolean): [PaymentGateway]

  """Fetch product reviews."""
  reviews(
    first: Int
    after: String
    where: ReviewsWhereArgs
  ): ReviewConnection

  """Fetch the current session."""
  session: Session
}

enum ProductIdTypeEnum {
  DATABASE_ID
  ID
  SLUG
  SKU
}

enum ProductVariationIdTypeEnum {
  DATABASE_ID
  ID
}

enum ProductCategoryIdTypeEnum {
  DATABASE_ID
  ID
  NAME
  SLUG
}

enum ProductTagIdTypeEnum {
  DATABASE_ID
  ID
  NAME
  SLUG
}

enum CouponIdTypeEnum {
  DATABASE_ID
  ID
  CODE
}

enum OrderIdTypeEnum {
  DATABASE_ID
  ID
  ORDER_NUMBER
}

enum CustomerIdTypeEnum {
  DATABASE_ID
  ID
  EMAIL
  USERNAME
}

input ProductCategoryWhereArgs {
  search: String
  slug: String
  parent: Int
  childOf: Int
  hideEmpty: Boolean
}

input ReviewsWhereArgs {
  productId: Int
  status: ReviewStatusEnum
  authorEmail: String
}

type CouponConnection {
  nodes: [Coupon]
  pageInfo: WPPageInfo
}

type CustomerConnection {
  nodes: [Customer]
  pageInfo: WPPageInfo
}

type TaxRateConnection {
  nodes: [TaxRate]
  pageInfo: WPPageInfo
}

# ─── Root Mutation ────────────────────────────────────────────────────────────

type Mutation {
  """Add a product to the cart."""
  addToCart(input: AddToCartInput!): AddToCartPayload

  """Update the quantity of a cart item."""
  updateCartItem(input: UpdateCartItemInput!): UpdateCartItemPayload

  """Remove one or more items from the cart."""
  removeItemsFromCart(input: RemoveItemsFromCartInput!): RemoveItemsFromCartPayload

  """Apply a coupon code to the cart."""
  applyCoupon(input: ApplyCouponInput!): ApplyCouponPayload

  """Remove coupon codes from the cart."""
  removeCoupons(input: RemoveCouponsInput!): RemoveCouponsPayload

  """Finalize the cart and create an order."""
  checkout(input: CheckoutInput!): CheckoutPayload

  """Create an order programmatically (admin)."""
  createOrder(input: CreateOrderInput!): CreateOrderPayload

  """Update an existing order."""
  updateOrder(input: UpdateOrderInput!): UpdateOrderPayload

  """Delete an order."""
  deleteOrder(input: DeleteOrderIdInput!): DeleteOrderPayload

  """Issue a refund against an order."""
  createRefund(input: CreateRefundInput!): CreateRefundPayload

  """Register a new customer account."""
  registerCustomer(input: RegisterCustomerInput!): RegisterCustomerPayload

  """Update a customer's profile or addresses."""
  updateCustomer(input: UpdateCustomerInput!): UpdateCustomerPayload

  """Authenticate a customer and receive session tokens."""
  login(input: LoginInput!): LoginPayload

  """Submit a product review."""
  writeReview(input: WriteReviewInput!): WriteReviewPayload

  """Delete a product review."""
  deleteReview(input: DeleteReviewInput!): DeleteReviewPayload

  """Refresh an expired JWT auth token."""
  refreshJwtAuthToken(input: RefreshJwtAuthTokenInput!): RefreshJwtAuthTokenPayload

  """Send a password reset email to a customer."""
  sendPasswordResetEmail(input: SendPasswordResetEmailInput!): SendPasswordResetEmailPayload
}

input DeleteOrderIdInput {
  id: ID!
  forceDelete: Boolean
  clientMutationId: String
}

input LoginInput {
  username: String!
  password: String!
  clientMutationId: String
}

input DeleteReviewInput {
  id: ID!
  forceDelete: Boolean
  clientMutationId: String
}

input RefreshJwtAuthTokenInput {
  jwtRefreshToken: String!
  clientMutationId: String
}

input SendPasswordResetEmailInput {
  username: String!
  clientMutationId: String
}

# ─── Schema Definition ────────────────────────────────────────────────────────

schema {
  query: Query
  mutation: Mutation
}
