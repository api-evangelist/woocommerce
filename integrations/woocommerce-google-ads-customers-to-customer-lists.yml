arazzo: 1.0.1
info:
  title: 'WooCommerce to Google Ads: Add new WooCommerce customers to Google Ads customer lists'
  summary: Add new WooCommerce customers to Google Ads customer lists
  description: Reads the customer WooCommerce reports through its REST API and hands it to Google Ads. Recreates the Zapier template "Add new WooCommerce customers to Google Ads customer lists" as a forkable workflow; the trigger is the WooCommerce customer.created webhook, which supplies the id.
  version: 1.0.0
sourceDescriptions:
- name: woocommerceApi
  url: https://raw.githubusercontent.com/api-evangelist/woocommerce/refs/heads/main/openapi/woocommerce-customers-api-openapi.yml
  type: openapi
- name: googleadsApi
  url: https://raw.githubusercontent.com/api-evangelist/google-ads/refs/heads/main/openapi/google-ads-customers-offlineuserdatajobs-api-openapi.yml
  type: openapi
workflows:
- workflowId: woocommerce-google-ads-customers-to-customer-lists
  summary: Add new WooCommerce customers to Google Ads customer lists
  description: Add new WooCommerce customers to Google Ads customer lists
  inputs:
    type: object
    properties:
      id:
        type: integer
        description: The WooCommerce customer id delivered by the customer.created webhook
      offlineUserDataJobResourceName:
        type: string
      hashedEmail:
        type: string
        description: SHA-256 of the normalized customer email (Google Ads requires hashing; no WooCommerce operation produces it)
    required:
    - id
  steps:
  - stepId: get-customer
    description: Retrieve the WooCommerce customer
    operationId: $sourceDescriptions.woocommerceApi.getCustomer
    parameters:
    - name: id
      in: path
      value: $inputs.id
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      customerId: $response.body#/id
      email: $response.body#/email
      firstName: $response.body#/first_name
      lastName: $response.body#/last_name
  - stepId: google-ads-googleads-customers-offlineuserdatajobs-addoperat
    description: Add new WooCommerce customers to Google Ads customer lists
    operationId: $sourceDescriptions.googleadsApi.googleads_customers_offlineUserDataJobs_addOperations
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      result: $response.body
    parameters:
    - name: resourceName
      in: path
      value: $inputs.offlineUserDataJobResourceName
    requestBody:
      contentType: application/json
      payload:
        operations:
        - create:
            userIdentifiers:
            - hashedEmail: $inputs.hashedEmail
  outputs:
    result: $steps.google-ads-googleads-customers-offlineuserdatajobs-addoperat.outputs.result
x-integration:
  partner: google-ads
  template: https://zapier.com/apps/google-ads/integrations/woocommerce/88826/add-new-woocommerce-customers-to-google-ads-customer-lists
  edge_evidence: https://zapier.com/apps/google-ads/integrations/woocommerce/88826/add-new-woocommerce-customers-to-google-ads-customer-lists
  edge_type: marketplace
  method: generated
  generated: '2026-10-12'
  generator: pipeline-enrich local-v5
  guessed_steps:
  - step: google-ads-googleads-customers-offlineuserdatajobs-addoperat
    cause: partner-contract
    why: Field mapping from the WooCommerce record into the partner payload is our choice; the Zapier template does not publish its mapping.
